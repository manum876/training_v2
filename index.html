<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Программа · Programa</title>
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#09090b; --card:#18181bcc; --card-solid:#18181b; --border:#27272a; --border-hover:#52525b;
    --amber:#f59e0b; --amber-bg:#f59e0b1a; --emerald:#10b981; --emerald-bg:#10b9811a;
    --rose:#f43f5e; --rose-bg:#f43f5e1a; --sky:#0ea5e9; --violet:#8b5cf6; --pink:#ec4899; --orange:#f97316; --gray:#3f3f46;
    --text:#f4f4f5; --muted:#a1a1aa; --muted2:#71717a; --dim:#52525b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; width:100%; max-width:100%; overflow-x:hidden; overscroll-behavior-x:none;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 96px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  header.top{position:sticky; top:0; z-index:20; background:#09090bf2; backdrop-filter:blur(8px); border-bottom:1px solid var(--border);}
  header.top .row{max-width:560px; margin:0 auto; padding:18px 16px 12px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .icon, .backbtn{width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px;}
  .brand .icon{background:var(--amber); color:#09090b;}
  .backbtn{background:var(--gray); color:var(--text); border:none; cursor:pointer;}
  .brand h1{font-size:13px; font-weight:900; letter-spacing:.15em; margin:0; line-height:1;}
  .brand p{font-size:11px; color:var(--muted2); margin:4px 0 0;}
  .langbtn{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:12px; font-weight:700; cursor:pointer;}
  .langbtn:hover{border-color:var(--amber); color:var(--amber);}
  .card{border-radius:10px; border:1px solid var(--border); background:var(--card); padding:16px; margin-bottom:16px;}
  .card label.hdr{display:flex; align-items:center; gap:6px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:4px;}
  input[type=date], input[type=number], input[type=text]{
    width:100%; background:#27272a; border:1px solid #3f3f46; border-radius:6px; padding:9px 10px; font-size:14px; color:var(--text); margin-top:4px;
  }
  input[type=date]{color-scheme:dark;}
  input:focus{outline:none; border-color:var(--amber);}
  .hint{font-size:12px; color:var(--muted2); margin-top:8px;}
  .status-line{font-size:12px; margin-top:8px;}
  .status-amber{color:var(--amber);} .status-emerald{color:var(--emerald);} .status-muted{color:var(--muted2);}
  .progress-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .progress-top span:first-child{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700;}
  .progress-top span:last-child{font-size:12px; color:var(--muted); font-family:ui-monospace,monospace;}
  .bar-bg{width:100%; height:10px; border-radius:999px; background:#27272a; overflow:hidden;}
  .bar-fill{height:100%; background:var(--amber); border-radius:999px; transition:width .3s;}
  .weeks{display:flex; flex-direction:column; gap:10px; margin-bottom:24px;}
  .week-card{border-radius:10px; border:1px solid var(--border); background:var(--card); padding:14px; display:flex; gap:12px;}
  .week-card.current{border-color:var(--amber); background:var(--amber-bg);}
  .week-bar{width:6px; border-radius:999px; flex-shrink:0; align-self:stretch;}
  .week-body{flex:1; min-width:0;}
  .week-tags{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:2px;}
  .tag{font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; border-radius:4px; padding:2px 6px;}
  .tag-amber{background:var(--amber); color:#09090b;}
  .tag-gray{background:var(--gray); color:#d4d4d8;}
  .week-num{font-size:12px; font-weight:800; color:#d4d4d8; font-family:ui-monospace,monospace;}
  .week-range{font-size:11px; color:var(--muted2); font-family:ui-monospace,monospace;}
  .week-title{font-size:14px; font-weight:800; margin-top:2px;}
  .week-focus{font-size:12px; color:var(--muted2); margin-top:2px;}
  .sess-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .sess-btn{display:flex; align-items:center; gap:5px; padding:6px 10px; border-radius:6px; font-size:12px; font-weight:700; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer;}
  .sess-btn.done{background:var(--emerald); border-color:var(--emerald); color:#09090b;}
  .sess-btn:hover{border-color:var(--border-hover);}
  .week-count{font-size:11px; color:var(--muted2); font-family:ui-monospace,monospace; align-self:flex-start; margin-top:2px;}
  .info-title{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin:0 0 10px;}
  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:28px;}
  .info-card{border-radius:10px; border:1px solid var(--border); background:var(--card); padding:14px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:8px;}
  .info-card:hover{border-color:var(--border-hover);}
  .info-card .emoji{font-size:20px;}
  .info-card .lbl{font-size:13px; font-weight:800;}
  .reset-wrap{display:flex; justify-content:center;}
  .reset-link{display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--dim); font-size:12px; cursor:pointer;}
  .reset-link:hover{color:var(--rose);}
  .reset-confirm{border-radius:10px; border:1px solid #f43f5e4d; background:var(--rose-bg); padding:12px; text-align:center;}
  .reset-confirm p{font-size:12px; color:#fda4af; margin:0 0 8px;}
  .reset-confirm .btns{display:flex; gap:8px; justify-content:center;}
  .btn-danger{font-size:12px; font-weight:700; background:var(--rose); color:#09090b; border:none; border-radius:6px; padding:7px 12px; cursor:pointer;}
  .btn-ghost{font-size:12px; font-weight:700; background:none; border:1px solid var(--border); color:#d4d4d8; border-radius:6px; padding:7px 12px; cursor:pointer;}

  /* session view */
  .sess-crumb{display:flex; gap:8px; font-size:12px; color:var(--muted2); font-family:ui-monospace,monospace; margin:8px 0 4px;}
  .sess-heading{font-size:20px; font-weight:900; margin:0 0 12px;}
  .complete-btn{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; padding:11px; margin-bottom:16px; font-size:14px; font-weight:800; border:1px solid var(--border); background:transparent; color:#d4d4d8; cursor:pointer;}
  .complete-btn.done{background:var(--emerald); border-color:var(--emerald); color:#09090b;}
  .warmup-note{font-size:12px; color:var(--muted2); line-height:1.5; margin-bottom:16px;}
  .ex-list{display:flex; flex-direction:column; gap:8px; margin-bottom:20px;}
  .ex-card{border-radius:10px; border:1px solid var(--border); background:#18181b80; padding:12px; display:flex; gap:10px; align-items:flex-start;}
  .ex-card.done{border-color:#059669aa; background:var(--emerald-bg);}
  .ex-check{width:24px; height:24px; border-radius:6px; border:2px solid #52525b; background:transparent; flex-shrink:0; margin-top:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#09090b; font-weight:900; font-size:13px;}
  .ex-check.done{background:var(--emerald); border-color:var(--emerald);}
  .ex-body{flex:1; min-width:0;}
  .ex-name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ex-name{font-weight:700; font-size:13.5px;}
  .ex-type{font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; border-radius:4px; padding:2px 6px; flex-shrink:0;}
  .ex-type.priority{background:var(--amber); color:#09090b;}
  .ex-type.support{background:var(--gray); color:#d4d4d8;}
  .ex-meta{font-size:11.5px; color:var(--muted2); margin-top:3px; font-family:ui-monospace,monospace;}
  .rest-timer{display:inline-flex; align-items:center; justify-content:center; gap:6px; margin-top:7px; padding:6px 9px; min-width:86px; border:1px solid var(--border); border-radius:7px; background:#27272a; color:var(--muted); font-family:ui-monospace,monospace; font-size:12px; font-weight:800; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;}
  .rest-timer:hover{border-color:var(--amber); color:var(--amber);}
  .rest-timer.running{border-color:var(--amber); background:var(--amber-bg); color:var(--amber);}
  .rest-timer.finished{border-color:var(--emerald); background:var(--emerald-bg); color:var(--emerald);}
  .ex-note{font-size:11.5px; color:var(--muted2); font-style:italic; margin-top:4px;}
  .ex-inputs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px;}
  .ex-inputs input{padding:6px 8px; font-size:12px; margin-top:0;}
  .elbow-block{margin-bottom:14px;}
  .elbow-block label{font-size:12px; color:var(--muted); font-weight:700;}
  input[type=range]{width:100%; margin-top:6px; accent-color:var(--amber);}
  .elbow-val{text-align:center; font-family:ui-monospace,monospace; font-weight:800; color:var(--amber); font-size:14px; margin-top:2px;}
  .stop-note{font-size:12px; color:#fb7185cc; line-height:1.5; margin-bottom:16px;}
  .session-actions{display:flex; align-items:stretch; gap:8px; margin-top:10px;}
  .session-actions .count{font-size:12px; color:var(--muted2); font-family:ui-monospace,monospace; align-self:center; margin-right:auto;}
  .share-btn,.complete-btn{font-weight:800; font-size:13px; border:none; border-radius:10px; padding:12px 14px; cursor:pointer; touch-action:manipulation;}
  .share-btn{background:#27272a; color:var(--text); border:1px solid var(--border);}
  .share-btn:hover{border-color:var(--amber); color:var(--amber);}
  .complete-btn{margin:0;}


  .week-summary{font-size:12px;color:#d4d4d8;line-height:1.45;margin-top:7px;}
  .mobility-card{border-radius:10px;border:1px solid var(--border);background:#18181b80;padding:12px;margin-bottom:16px;}
  .mobility-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);font-weight:800;margin-bottom:8px;}
  .mobility-item{padding:7px 0;border-top:1px solid var(--border);font-size:12px;}
  .mobility-item:first-child{border-top:none;padding-top:0;}
  .mobility-name{font-weight:800;}
  .mobility-desc{color:var(--muted2);line-height:1.4;margin-top:2px;}
  .mobility-meta{color:var(--muted);font-family:ui-monospace,monospace;font-size:10.5px;margin-top:2px;}
  .ex-desc{font-size:11.5px;color:#a1a1aa;line-height:1.4;margin-top:4px;}
  /* info view */
  .info-head{display:flex; align-items:center; gap:10px; margin:8px 0 16px;}
  .info-head .emoji{font-size:26px;}
  .info-head h2{font-size:20px; font-weight:900; margin:0;}
  .block-heading{font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color:var(--amber); margin:18px 0 8px;}
  .block-heading:first-child{margin-top:0;}
  .block-p{font-size:14px; color:#d4d4d8; line-height:1.6; margin:0 0 10px;}
  ul.block-bullets{list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:8px;}
  ul.block-bullets li{font-size:14px; color:#d4d4d8; line-height:1.6; display:flex; gap:8px;}
  ul.block-bullets li .dash{color:var(--amber); flex-shrink:0;}
</style>
</head>
<body>
<header class="top"><div class="row" id="headerRow"></div></header>
<main class="wrap" id="app"></main>

<script>
// ---------------------------------------------------------------------------
// UI copy
// ---------------------------------------------------------------------------
const UI = {
  ru: {
    appTitle:"ПРОГРАММА", appSub:"16 недель · 4×8 · гипертрофия",
    startDateLabel:"Дата начала программы",
    startDateHint:"Задай дату — по ней будут считаться недели и текущее положение в программе.",
    notStartedYet:"Программа ещё не началась", finished:"Программа завершена",
    week:"Неделя", session:"Тренировка", deloadTag:"Разгрузка", testTag:"Тестовая",
    overallProgress:"Общий прогресс", of:"из",
    reset:"Сбросить прогресс", resetConfirm:"Точно сбросить весь прогресс и все записи? Это нельзя отменить.",
    yes:"Да, сбросить", cancel:"Отмена",
    current:"текущая",
    infoTitle:"Справочник",
    priority:"Приоритет", support:"Поддержка",
    colTempo:"Темп", colRest:"Отдых",
    weightUsed:"Вес, кг", repsDone:"Повторы", rpeActual:"RPE факт",
    complete:"Тренировка выполнена", markComplete:"Отметить как выполненную",
    elbowPain:"Боль в локте (0-10)",
    saveLog:"Сохранить запись", savedLog:"Сохранено ✓",
    shareWorkout:"Поделиться",
    warmupNote:"Короткая movilidad de hasta 10 min; haz las 3 propuestas antes de los ejercicios y adapta el rango si algo molesta.",
    stopNote:"Острая боль в локте — снизь вес на 30% и сократи амплитуду в этот же день.",
    exercisesOf:"упражнений отмечено",
    restStart:"Начать отдых", restRunning:"Отдых", restDone:"Отдых завершён", mobility:"Мобильность", weekSummary:"Resumen semanal",
    notificationTitle:"Время отдыха вышло", notificationBody:"Можно начинать следующий подход."
  },
  es: {
    appTitle:"PROGRAMA", appSub:"16 semanas · 4×8 · hipertrofia",
    startDateLabel:"Fecha de inicio del programa",
    startDateHint:"Define una fecha — con ella se calculan las semanas y en qué punto estás del programa.",
    notStartedYet:"El programa aún no ha comenzado", finished:"Programa terminado",
    week:"Semana", session:"Entreno", deloadTag:"Descarga", testTag:"Prueba",
    overallProgress:"Progreso general", of:"de",
    reset:"Reiniciar progreso", resetConfirm:"¿Seguro que quieres borrar todo el progreso y los registros? No se puede deshacer.",
    yes:"Sí, reiniciar", cancel:"Cancelar",
    current:"actual",
    infoTitle:"Referencia",
    priority:"Prioridad", support:"Mantenimiento",
    colTempo:"Tempo", colRest:"Descanso",
    weightUsed:"Peso, kg", repsDone:"Reps", rpeActual:"RPE real",
    complete:"Entreno completado", markComplete:"Marcar como completado",
    elbowPain:"Dolor de codo (0-10)",
    saveLog:"Guardar registro", savedLog:"Guardado ✓",
    shareWorkout:"Compartir",
    warmupNote:"Movilidad breve de hasta 10 min; haz las 3 propuestas antes de los ejercicios y adapta el rango si algo molesta.",
    stopNote:"Dolor agudo en el codo — reduce el peso un 30% y acorta el rango ese mismo día.",
    exercisesOf:"ejercicios marcados",
    restStart:"Iniciar descanso", restRunning:"Descanso", restDone:"Descanso terminado", mobility:"Movilidad", weekSummary:"Resumen semanal",
    notificationTitle:"Fin del descanso", notificationBody:"Ya puedes empezar la siguiente serie."
  },
};
const MONTHS = {
  ru:["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"],
  es:["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],
};
const fmtDate = (d,l) => `${d.getDate()} ${MONTHS[l][d.getMonth()]}`;

// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// Programa de 16 semanas — 4 sesiones × 8 ejercicios
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// State + persistence (localStorage)
// ---------------------------------------------------------------------------
let lang = "es";
let startDate = "";
let progress = {};
let view = "home"; // home | session | info
let activeWeek = null, activeDay = null, activeInfo = null;
let sessionEntries = [];
let sessionElbow = "";

function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem("ptracker_settings") || "null");
    if(s){ if(s.startDate) startDate = s.startDate; if(s.lang) lang = s.lang; }
  }catch(e){}
  try{
    const p = JSON.parse(localStorage.getItem("ptracker_progress") || "null");
    if(p) progress = p;
  }catch(e){}
}
function saveSettings(){ localStorage.setItem("ptracker_settings", JSON.stringify({startDate, lang})); }
function saveProgress(){ localStorage.setItem("ptracker_progress", JSON.stringify(progress)); }
function logKey(w,d){ return `ptracker_log_w${w}_d${d}`; }
function loadSessionLog(w,d){
  const rows = rowsFor(w,d);
  try{
    const raw = JSON.parse(localStorage.getItem(logKey(w,d)) || "null");
    if(raw && raw.entries){ sessionEntries = raw.entries; sessionElbow = raw.elbowPain||""; return; }
  }catch(e){}
  sessionEntries = rows.map(()=>({done:false,weight:"",reps:"",rpe:""}));
  sessionElbow = "";
}
function saveSessionLog(w,d){
  localStorage.setItem(logKey(w,d), JSON.stringify({entries:sessionEntries, elbowPain:sessionElbow}));
}

function computeWeekInfo(){
  if(!startDate) return {weekRanges:[], currentWeek:null};
  const start = new Date(startDate+"T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.floor((today-start)/86400000);
  const cw = diffDays>=0 ? Math.min(16, Math.floor(diffDays/7)+1) : null;
  const ranges = WEEK_MAP.map((_,i)=>{
    const s = new Date(start); s.setDate(s.getDate()+i*7);
    const e = new Date(s); e.setDate(e.getDate()+6);
    return {start:s,end:e};
  });
  return {weekRanges:ranges, currentWeek:cw};
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderHeader(){
  const t = UI[lang];
  const back = view!=="home" ? `<button class="backbtn" id="backBtn">‹</button>` : `<div class="icon">🏋️</div>`;
  document.getElementById("headerRow").innerHTML = `
    <div class="brand">${back}
      <div><h1>${t.appTitle}</h1><p>${t.appSub}</p></div>
    </div>
    <button class="langbtn" id="langBtn">🌐 ${lang==="ru"?"ES":"RU"}</button>
  `;
  const backBtn = document.getElementById("backBtn");
  if(backBtn) backBtn.onclick = ()=>{ view="home"; render(); };
  document.getElementById("langBtn").onclick = ()=>{ lang = lang==="ru"?"es":"ru"; saveSettings(); render(); };
}

function render(){
  renderHeader();
  const app = document.getElementById("app");
  if(view==="home") app.innerHTML = renderHome();
  else if(view==="session") app.innerHTML = renderSession();
  else if(view==="info") app.innerHTML = renderInfo();
  mount();
}

function renderHome(){
  const t = UI[lang];
  const {weekRanges, currentWeek} = computeWeekInfo();
  const completed = Object.values(progress).filter(Boolean).length;
  const pct = Math.round((completed/TOTAL_SESSIONS)*100);

  let statusLine = "";
  if(startDate){
    if(currentWeek===null) statusLine = `<p class="status-line status-muted">${t.notStartedYet}</p>`;
    else if(currentWeek>=16 && weekRanges[15] && new Date()>weekRanges[15].end) statusLine = `<p class="status-line status-emerald">${t.finished}</p>`;
    else statusLine = `<p class="status-line status-amber mono">${t.week} ${currentWeek} / 16</p>`;
  }

  let weeksHtml = "";
  WEEK_MAP.forEach((info,i)=>{
    const weekNum = i+1;
    const isCurrent = currentWeek===weekNum;
    const range = weekRanges[i];
    const sessions = SESSIONS_FOR(info);
    const title = titleFor(weekNum)[lang];
    const focus = focusFor(weekNum)[lang];
    let doneInWeek = 0;
    let sessBtns = "";
    for(let s=1;s<=sessions;s++){
      const done = !!progress[`w${weekNum}-d${s}`];
      if(done) doneInWeek++;
      sessBtns += `<button class="sess-btn ${done?"done":""}" data-week="${weekNum}" data-day="${s}">${done?"✓ ":""}${t.session} ${s} ›</button>`;
    }
    const tags = `
      ${range?`<span class="week-range">${fmtDate(range.start,lang)}–${fmtDate(range.end,lang)}</span>`:""}
      ${isCurrent?`<span class="tag tag-amber">${t.current}</span>`:""}
      ${info.deload?`<span class="tag tag-gray">${t.deloadTag}</span>`:""}
      ${weekNum===16?`<span class="tag tag-amber">${t.testTag}</span>`:""}
    `;
    weeksHtml += `
      <div class="week-card ${isCurrent?"current":""}">
        <div class="week-bar" style="background:${PHASE_COLORS[i%PHASE_COLORS.length]}"></div>
        <div class="week-body">
          <div class="week-tags"><span class="week-num">${t.week} ${weekNum}</span>${tags}</div>
          <div class="week-title">${esc(title)}</div>
          <div class="week-focus">${esc(focus)}</div><div class="week-summary">${esc(info.summary)}</div>
          <div class="sess-row">${sessBtns}</div>
        </div>
        <span class="week-count">${doneInWeek}/${sessions}</span>
      </div>`;
  });

  let infoHtml = "";
  INFO_TOPICS.forEach(topic=>{
    infoHtml += `<button class="info-card" data-info="${topic.id}"><span class="emoji">${topic.emoji}</span><span class="lbl">${esc(topic.title[lang])}</span></button>`;
  });

  return `
    <div class="card">
      <label class="hdr">📅 ${t.startDateLabel}</label>
      <input type="date" id="startDateInput" value="${startDate}">
      ${!startDate?`<p class="hint">${t.startDateHint}</p>`:statusLine}
    </div>
    <div class="card">
      <div class="progress-top"><span>${t.overallProgress}</span><span class="mono">${completed} ${t.of} ${TOTAL_SESSIONS}</span></div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="weeks">${weeksHtml}</div>
    <p class="info-title">${t.infoTitle}</p>
    <div class="info-grid">${infoHtml}</div>
    <div class="reset-wrap" id="resetWrap">
      <button class="reset-link" id="resetLink">↺ ${t.reset}</button>
    </div>
  `;
}

const restTimers = {};
const REST_STORAGE_KEY = "ptracker_active_rest";

function getRestSeconds(rest){
  const nums = String(rest).match(/\d+(?:[.,]\d+)?/g);
  if(!nums || !nums.length) return 0;
  return Math.max(0, Math.floor(parseFloat(nums[0].replace(",","."))));
}

async function requestNotificationPermission(){
  if(!("Notification" in window)) return false;
  if(Notification.permission === "granted") return true;
  if(Notification.permission === "denied") return false;
  try{return (await Notification.requestPermission()) === "granted";}catch(e){return false;}
}

function sendRestNotification(){
  if("Notification" in window && Notification.permission === "granted") {
    try{new Notification(UI[lang].notificationTitle,{body:UI[lang].notificationBody,tag:"ptracker-rest-finished"});}catch(e){}
  }
}

function persistRestTimer(state){
  if(!state) { localStorage.removeItem(REST_STORAGE_KEY); return; }
  localStorage.setItem(REST_STORAGE_KEY,JSON.stringify({
    idx:state.idx,endAt:state.endAt,week:activeWeek,day:activeDay
  }));
}

function clearRestTimer(idx,removePersist=true){
  const state=restTimers[idx];
  if(state){
    if(state.interval) clearInterval(state.interval);
    if(state.timeout) clearTimeout(state.timeout);
  }
  delete restTimers[idx];
  if(removePersist){
    try{
      const saved=JSON.parse(localStorage.getItem(REST_STORAGE_KEY)||"null");
      if(saved && Number(saved.idx)===Number(idx)) localStorage.removeItem(REST_STORAGE_KEY);
    }catch(e){}
  }
}

function finishRestTimer(idx,state){
  if(restTimers[idx]!==state) return;
  clearRestTimer(idx);
  const btn=document.querySelector(`.rest-timer[data-idx="${idx}"]`);
  if(btn){
    btn.classList.remove("running");
    btn.classList.add("finished");
    btn.textContent=`✓ ${UI[lang].restDone}`;
  }
  sendRestNotification();
}

function updateRestTimer(idx,state){
  if(restTimers[idx]!==state) return;
  const msLeft=Math.max(0,state.endAt-Date.now());
  state.remaining=Math.ceil(msLeft/1000);
  if(msLeft<=0){ finishRestTimer(idx,state); return; }
  const btn=document.querySelector(`.rest-timer[data-idx="${idx}"]`);
  if(btn){
    btn.classList.add("running");
    btn.classList.remove("finished");
    const m=Math.floor(state.remaining/60),s=state.remaining%60;
    btn.textContent=`⏱ ${m}:${String(s).padStart(2,"0")}`;
  }
}

function startRestTimer(idx,seconds){
  if(!seconds) return;
  clearRestTimer(idx,false);
  const endAt=Date.now()+seconds*1000;
  const state={idx,endAt,remaining:seconds,interval:null,timeout:null};
  restTimers[idx]=state;
  persistRestTimer(state);
  updateRestTimer(idx,state);
  state.interval=setInterval(()=>updateRestTimer(idx,state),250);
  state.timeout=setTimeout(()=>updateRestTimer(idx,state),seconds*1000+100);
}

function restoreRestTimer(){
  try{
    const saved=JSON.parse(localStorage.getItem(REST_STORAGE_KEY)||"null");
    if(!saved || Number(saved.week)!==Number(activeWeek) || Number(saved.day)!==Number(activeDay)) return;
    const remaining=Math.ceil((Number(saved.endAt)-Date.now())/1000);
    if(remaining<=0){
      localStorage.removeItem(REST_STORAGE_KEY);
      sendRestNotification();
      const btn=document.querySelector(`.rest-timer[data-idx="${saved.idx}"]`);
      if(btn){btn.classList.add("finished");btn.textContent=`✓ ${UI[lang].restDone}`;}
      return;
    }
    startRestTimer(Number(saved.idx),remaining);
    // Keep the original absolute deadline rather than extending it.
    const state=restTimers[Number(saved.idx)];
    if(state){state.endAt=Number(saved.endAt);persistRestTimer(state);}
  }catch(e){}
}

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    Object.keys(restTimers).forEach(k=>updateRestTimer(Number(k),restTimers[k]));
    restoreRestTimer();
  }
});
window.addEventListener("pageshow",()=>{
  Object.keys(restTimers).forEach(k=>updateRestTimer(Number(k),restTimers[k]));
  restoreRestTimer();
});

function saveSessionField(idx,field,value){
  if(!sessionEntries[idx]) sessionEntries[idx]={done:false,weight:"",reps:"",rpe:""};
  sessionEntries[idx][field]=value;
  saveSessionLog(activeWeek,activeDay);
}

function parseSets(value){
  const m=String(value||"").match(/\d+/);
  return m ? m[0] : "";
}

function parsePrescribedReps(value){
  const str=String(value||"");
  const m=str.match(/[×x]\s*([0-9]+(?:-[0-9]+)?)/i);
  return m ? m[1] : "";
}

async function shareWorkoutImage(){
  const t=UI[lang];
  const rows=rowsFor(activeWeek,activeDay);
  const title=titleFor(activeWeek)[lang];
  const W=750, H=1334;
  const canvas=document.createElement("canvas");
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#09090b"; ctx.fillRect(0,0,W,H);
  const pad=48;
  let y=62;
  ctx.fillStyle="#f59e0b"; ctx.font="800 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
  ctx.fillText(t.appTitle || "PROGRAMA",pad,y);
  y+=42;
  ctx.fillStyle="#f4f4f5"; ctx.font="900 30px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
  ctx.fillText(`${t.week} ${activeWeek} · ${t.session} ${activeDay}`,pad,y);
  y+=42;
  ctx.fillStyle="#d4d4d8"; ctx.font="700 21px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
  const titleLines=[];
  const words=String(title).split(/\s+/); let line="";
  words.forEach(word=>{ const test=line?line+" "+word:word; if(ctx.measureText(test).width>W-pad*2 && line){titleLines.push(line); line=word;}else line=test; });
  if(line) titleLines.push(line);
  titleLines.forEach(l=>{ctx.fillText(l,pad,y); y+=29;});
  y+=20;
  ctx.strokeStyle="#27272a"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke(); y+=34;
  ctx.fillStyle="#a1a1aa"; ctx.font="800 15px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
  ctx.fillText(lang==="es"?"EJERCICIO":"УПРАЖНЕНИЕ",pad,y);
  ctx.fillText(lang==="es"?"PESO":"ВЕС",430,y);
  ctx.fillText(lang==="es"?"SERIES":"ПОДХОДЫ",525,y);
  ctx.fillText(lang==="es"?"REPS":"ПОВТОРЫ",640,y);
  y+=18;
  ctx.strokeStyle="#27272a"; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke(); y+=28;

  const drawWrapped=(text,x,maxWidth,font,lineHeight)=>{
    ctx.font=font; const words=String(text).split(/\s+/); let lines=[]; let line="";
    words.forEach(word=>{const test=line?line+" "+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word;}else line=test;}); if(line) lines.push(line);
    lines.forEach(l=>{ctx.fillText(l,x,y);y+=lineHeight;}); return lines.length;
  };
  rows.forEach((r,i)=>{
    const e=sessionEntries[i]||{};
    const ex=String(r.ex[lang]);
    const weight=e.weight!==undefined&&e.weight!==""?String(e.weight):"—";
    const reps=e.reps!==undefined&&e.reps!==""?String(e.reps):"—";
    const sets=parseSets(r.setsReps)||"—";
    const rowHeight=Math.max(58, Math.ceil(ctx.measureText(ex).width/360)*23+24);
    if(y+rowHeight>H-60) return;
    ctx.fillStyle="#f4f4f5"; ctx.font="700 16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
    drawWrapped(ex,pad,350,"700 16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif",22);
    const baseY=y-((Math.max(1,Math.ceil(ctx.measureText(ex).width/350))>1)?22:0);
    ctx.fillStyle="#f4f4f5"; ctx.font="800 16px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillText(weight,430,baseY); ctx.fillText(sets,535,baseY); ctx.fillText(reps,650,baseY);
    y=Math.max(y,baseY+18)+22;
    ctx.strokeStyle="#18181b"; ctx.beginPath(); ctx.moveTo(pad,y-10); ctx.lineTo(W-pad,y-10); ctx.stroke();
  });
  ctx.fillStyle="#52525b"; ctx.font="600 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
  ctx.fillText("Program tracker",pad,H-28);

  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png",0.92));
  if(!blob) return;
  const file=new File([blob],`entreno-${activeWeek}-${activeDay}.png`,{type:"image/png"});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({title:String(title),text:`${t.week} ${activeWeek} · ${t.session} ${activeDay}`,files:[file]}); return; }catch(e){ if(e && e.name==="AbortError") return; }
  }
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=file.name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function renderSession(){
  const t = UI[lang];
  const week = activeWeek, day = activeDay;
  const rows = rowsFor(week,day);
  const title = titleFor(week)[lang];
  const done = !!progress[`w${week}-d${day}`];

  let exHtml = "";
  rows.forEach((r,i)=>{
    const e = sessionEntries[i] || {done:false,weight:"",reps:"",rpe:""};
    exHtml += `
      <div class="ex-card ${e.done?"done":""}" data-idx="${i}">
        <button class="ex-check ${e.done?"done":""}" data-idx="${i}">${e.done?"✓":""}</button>
        <div class="ex-body">
          <div class="ex-name-row">
            <span class="ex-name">${esc(r.ex[lang])}</span>
            <span class="ex-type ${r.type}">${r.type==="priority"?t.priority:t.support}</span>
          </div>
          <div class="ex-meta">${r.setsReps} · ${t.colTempo} ${r.tempo} · RPE ${r.rpe} · ${t.colRest} ${r.rest}s</div><div class="ex-desc">${esc(r.description?.[lang]||"")}</div>
          ${getRestSeconds(r.rest)>0?`<button type="button" class="rest-timer" data-idx="${i}" data-seconds="${getRestSeconds(r.rest)}">⏱ ${getRestSeconds(r.rest)}s</button>`:""}
          ${r.note[lang]?`<div class="ex-note">${esc(r.note[lang])}</div>`:""}
          <div class="ex-inputs">
            <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" autocomplete="off" placeholder="${t.weightUsed}" data-idx="${i}" data-field="weight" value="${esc(e.weight)}">
            <input type="text" inputmode="numeric" placeholder="${t.repsDone}" data-idx="${i}" data-field="reps" value="${esc(e.reps)}">
            <input type="text" inputmode="numeric" placeholder="${t.rpeActual}" data-idx="${i}" data-field="rpe" value="${esc(e.rpe)}">
          </div>
        </div>
      </div>`;
  });

  const doneCount = sessionEntries.filter(e=>e.done).length;

  return `
    <div class="sess-crumb"><span>${t.week} ${week}</span><span>·</span><span>${t.session} ${day}</span></div>
    <h2 class="sess-heading">${esc(title)}</h2>
    <p class="warmup-note">${t.warmupNote}</p>
    <div class="mobility-card">
      <div class="mobility-title">🧘 ${t.mobility}</div>
      ${mobilityFor(week,day).map(m=>`<div class="mobility-item">
        <div class="mobility-name">${esc(m.name)}</div>
        <div class="mobility-desc">${esc(m.desc)}</div>
        <div class="mobility-meta">${m.setsReps} · ${m.tempo} · RPE ${m.rpe} · ${m.rest}s</div>
      </div>`).join("")}
    </div>
    <div class="ex-list">${exHtml}</div>
    <div class="elbow-block">
      <label>${t.elbowPain}</label>
      <input type="range" min="0" max="10" id="elbowRange" value="${sessionElbow||0}">
      <div class="elbow-val" id="elbowVal">${sessionElbow||0}</div>
    </div>
    <p class="stop-note">${t.stopNote}</p>
    <div class="session-actions">
      <span class="count" id="exCount">${doneCount}/${rows.length} ${t.exercisesOf}</span>
      <button type="button" class="share-btn" id="shareWorkoutBtn">↗ ${t.shareWorkout}</button>
      <button type="button" class="complete-btn ${done?"done":""}" id="completeBtn">${done?"✓ ":""}${done?t.complete:t.markComplete}</button>
    </div>
  `;
}

function renderInfo(){
  const t = UI[lang];
  const topic = INFO_TOPICS.find(x=>x.id===activeInfo);
  if(!topic) return "";
  let blocksHtml = "";
  topic.blocks.forEach(block=>{
    if(block.type==="p"){
      blocksHtml += block.heading
        ? `<div class="block-heading">${esc(block[lang])}</div>`
        : `<p class="block-p">${esc(block[lang])}</p>`;
    } else {
      let items = block.items.map(it=>`<li><span class="dash">—</span><span>${esc(it[lang])}</span></li>`).join("");
      blocksHtml += `<ul class="block-bullets">${items}</ul>`;
    }
  });
  return `
    <div class="info-head"><span class="emoji">${topic.emoji}</span><h2>${esc(topic.title[lang])}</h2></div>
    ${blocksHtml}
  `;
}

// ---------------------------------------------------------------------------
// Event mounting (per view)
// ---------------------------------------------------------------------------
function mount(){
  if(view==="home") mountHome();
  else if(view==="session") mountSession();
}

function mountHome(){
  const startDateInput = document.getElementById("startDateInput");
  startDateInput.onchange = (e)=>{ startDate = e.target.value; saveSettings(); render(); };

  document.querySelectorAll(".sess-btn").forEach(btn=>{
    btn.onclick = ()=>{
      activeWeek = parseInt(btn.dataset.week,10);
      activeDay = parseInt(btn.dataset.day,10);
      loadSessionLog(activeWeek, activeDay);
      view = "session";
      render();
    };
  });

  document.querySelectorAll(".info-card").forEach(btn=>{
    btn.onclick = ()=>{ activeInfo = btn.dataset.info; view="info"; render(); };
  });

  const resetLink = document.getElementById("resetLink");
  resetLink.onclick = ()=>{
    const t = UI[lang];
    document.getElementById("resetWrap").innerHTML = `
      <div class="reset-confirm">
        <p>${t.resetConfirm}</p>
        <div class="btns">
          <button class="btn-danger" id="confirmResetBtn">${t.yes}</button>
          <button class="btn-ghost" id="cancelResetBtn">${t.cancel}</button>
        </div>
      </div>`;
    document.getElementById("confirmResetBtn").onclick = ()=>{
      progress = {}; saveProgress();
      Object.keys(localStorage).filter(k=>k.startsWith("ptracker_log_")).forEach(k=>localStorage.removeItem(k));
      render();
    };
    document.getElementById("cancelResetBtn").onclick = render;
  };
}

function mountSession(){
  const t = UI[lang];
  const week = activeWeek, day = activeDay;

  document.getElementById("completeBtn").onclick = ()=>{
    const key = `w${week}-d${day}`;
    progress[key] = !progress[key];
    saveProgress();
    render();
  };

  document.querySelectorAll(".ex-check").forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.idx,10);
      sessionEntries[idx].done = !sessionEntries[idx].done;
      saveSessionLog(week, day);
      const card = document.querySelector(`.ex-card[data-idx="${idx}"]`);
      card.classList.toggle("done", sessionEntries[idx].done);
      btn.classList.toggle("done", sessionEntries[idx].done);
      btn.textContent = sessionEntries[idx].done ? "✓" : "";
      document.getElementById("exCount").textContent = `${sessionEntries.filter(e=>e.done).length}/${sessionEntries.length} ${t.exercisesOf}`;
    };
  });

  document.querySelectorAll('.ex-inputs input').forEach(inp=>{
    inp.oninput = ()=>{
      const idx = parseInt(inp.dataset.idx,10);
      let value = inp.value;
      if(inp.dataset.field === "weight") {
        // Allow decimal weights on iPhone with either comma or dot.
        value = value.replace(/[^0-9.,]/g, "");
        const parts = value.split(/[.,]/);
        if(parts.length > 2) value = parts[0] + "." + parts.slice(1).join("");
        else value = value.replace(",", ".");
        if(value !== inp.value) inp.value = value;
      }
      sessionEntries[idx][inp.dataset.field] = value;
      saveSessionLog(week, day);
    };
  });

  document.querySelectorAll(".rest-timer").forEach(btn=>{
    btn.onclick=async()=>{
      const idx=parseInt(btn.dataset.idx,10), seconds=parseInt(btn.dataset.seconds,10);
      if(!restTimers[idx]) await requestNotificationPermission();
      startRestTimer(idx,seconds);
    };
  });

  const elbowRange = document.getElementById("elbowRange");
  elbowRange.oninput = ()=>{
    sessionElbow = elbowRange.value;
    saveSessionLog(week, day);
    document.getElementById("elbowVal").textContent = elbowRange.value;
  };

  document.getElementById("shareWorkoutBtn").onclick = shareWorkoutImage;
  restoreRestTimer();
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
loadState();
render();
</script>
</body>
</html>
